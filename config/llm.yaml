# LLM layer settings. Schema: seminars.config.LLMConfig (unknown keys are an error).
# Overrides: LLM_PROVIDERS (comma separated), LLM_MODEL_<PROVIDER>, LLM_BASE_URL.
# How to set, change and check credentials: docs/LLM_CREDENTIALS.md.

# Provider chain in order of preference: subscriptions first, then pay-per-request
# APIs. A provider joins the chain only when its credential is configured.
# codex-cli is opt-in and local only: it is used only when LLM_PROVIDERS names it,
# never inside GitHub Actions, and only for field tagging.
providers:
  - claude-cli
  - codex-cli
  - anthropic
  - openai
  - openai-compat

# The cheapest model of each provider that is good enough for tagging and extraction.
# null means: no model configured. A CLI provider then uses the default of the CLI,
# an API provider is skipped. openai-compat has no default; set LLM_MODEL_OPENAI_COMPAT.
# A CLI provider whose login may not use the configured model falls back to the
# default of the CLI and reports a warning.
models:
  claude-cli: haiku             # alias; resolved by the CLI to the current Haiku model
  codex-cli: gpt-6-luna         # accepted by the ChatGPT login of the owner (2026-11-11)
  anthropic: claude-haiku-5-5
  openai: gpt-6-luna
  openai-compat: null

# The CLI versions the command lines in seminars.llm.claude_cli and
# seminars.llm.codex_cli were verified with. Claude Code is installed at exactly this
# version in CI; another installed version is reported as a warning. The flags that
# switch tools off change between versions: verify again before changing a number here.
cli_versions:
  claude-cli: "2.1.322"
  codex-cli: "0.167.0"

# Endpoint of openai-compat, e.g. https://llm.example.org/v1 (or set LLM_BASE_URL).
# It must be https: LLM_API_KEY goes there with every request. Plain http is accepted
# only for this machine (localhost or a loopback address).
base_url: null

batch_size: 20              # events per tagging request
max_calls_per_run: 60       # hard cap of provider requests in one run
max_input_chars: 12000      # longest user prompt that is sent; longer input is skipped
timeout_seconds: 120        # per request
cache_ttl_days: 180         # an unused cache entry is pruned after this many days
grounding_min_similarity: 90  # fuzzy ratio an extracted text needs against the page text
