# Category labels whose events are always out of scope, matched like the labels
# of "departments" (ignoring case, accents and punctuation). An event that carries
# one is excluded by the filter with reason out_of_scope, whatever its title, its
# other categories or its source fields say, and never goes to the LLM. For units
# that share a school with ones that hold talks, but whose events are not talks.
out_of_scope_categories:
  # Courses for practising clinicians (accredited CME), not academic talks; the
  # owner's choice of 2026-11-11. Their records also carry "School of Medicine".
  - Stanford Center for Continuing Medical Education

# Filter phrases per exclusion reason (seminars.classify.filters). A phrase in the
# title or the series excludes the event, unless the title or the series also
# names a talk ("seminar", "colloquium", "lecture", "talk", ...): such events are
# kept and handed to the LLM, as are events where a phrase only matches a category
# label. A phrase that names a talk itself ("no seminar", "career talk") always
# excludes. The abstract is never read. A phrase is final without an LLM, so a
# word that is also a research topic or a common title word is listed only in
# phrases that are not: "tutoring session" but not "tutoring" (intelligent
# tutoring systems), "welcome reception" but not "reception" (signal reception,
# the reception of a text), "yoga class" but not "yoga" (a clinical trial of
# yoga), "town hall with" but not "town hall" (a collaboration's town hall on
# its experiments), "certificate program" but not "certificate" (proof
# certificates), "coffee hour" but not "coffee" (coffee rust).
