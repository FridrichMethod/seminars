# Field rules and filter phrases. Schema: seminars.config.Taxonomy (unknown keys are an error).
#
# How a term matches (seminars.classify.rules):
# * whole words only, ignoring case and accents: "bio" never matches "biography",
#   "AI" never matches "Taiwan", "Kahler" matches the accented spelling;
# * spaces, hyphens and slashes are the same: "cryo-EM" matches "cryo EM";
# * the words of a phrase must be adjacent and in one sentence;
# * the last word may be singular or plural: "enzyme" matches "enzymes"; a word
#   in "-ics" is never made singular ("genetics" does not match "genetic"), so
#   an adjective that should count is listed on its own ("genomic");
# * a final "*" matches the start of a word: "superconduct*" matches
#   "superconductivity" (at least three letters before the "*").
#
# How a field is decided (in this order):
# 0. an event of a category listed under out_of_scope_categories gets none: the
#    filter drops it as out_of_scope before anything below is looked at;
# 1. source fields: default_fields of the source entry (config/sources.d), the
#    adapter's hints, source_defaults and departments below;
# 2. rules per field: a name in "series" found in the series or the title implies
#    the field; otherwise the weights of the distinct keywords found in title,
#    series and abstract must add up to min_score (1.0 unless set). The abstract
#    counts without its sections on the speaker and the series (headings such as
#    "Bio", "About the Speaker", "About the ... Seminar Series"): a speaker's
#    degree in physics says nothing about the talk. Weak terms get 0.5 so that
#    they count only together with a second one (cs has none: see there). A
#    word counts for one keyword of a field only: where keywords overlap ("drug"
#    in "drug discovery"), the heaviest counts, then the longest. A match of
#    exclude_keywords vetoes the rules of that field (never a source field);
#    an event without source fields (the campus-wide calendar) needs the series
#    name or enough weight in title and series: there the abstract alone never
#    decides, because abstracts of humanities, policy and wellness talks name
#    "AI", "a physicist" or "vaccines" in passing;
# 3. an event with no field at all is handed to the LLM tagger when there is one,
#    and is otherwise dropped as out_of_scope.
#
# A keyword decides on its own in a title, so a word that is also a name, a
# metaphor or a passing mention ("Ai Weiwei", "the DNA of great companies", "a
# catalyst for change") gets 0.5, and the phrases of research get 1.0 ("AI
# safety", "DNA repair", "single-atom catalyst").

