# Source id -> fields, in addition to the default_fields of the source entry itself.
# Prefer default_fields in config/sources.d; use this for a source whose entry
# you do not want to edit.
source_defaults: {}

# Category label of a source (EventHints.categories) -> fields. A label must equal
# the source's label, ignoring case, accents and punctuation: "Department of
# Chemistry" and "Chemistry" are different labels. A match is a source field: it
# is final, vetoes do not remove it and the LLM never sees it. Tags
# (EventHints.tags: the free keywords of a Stanford Events record) never match:
# "mathematics" on a talk about the history of astronomy names no department.
#
# This list is for sources whose adapter has no department map of its own. The
# Stanford Events calendar has one (department_fields and group_fields in
# config/sources.d/localist.yaml, with the exact names of its units); put a
# department of that calendar there, not here. Never list a label of a broad
# subject, type or audience filter: the calendar files wellness fairs, nutrition
# classes and medical humanities under the subject "Medicine", so "Medicine" is
# not a department here ("Department of Medicine" is).
#
# A unit that the calendar's map also names gets the same fields here as there
# (the owner's choices of 2026-11-11, for example ICME -> math and Stanford Data
# Science -> math + ai-ml): the tagger adds the fields of a label below to those
# of the calendar's map, so a different list would add a field nobody chose.
departments:
  Mathematics: [math]
  Department of Mathematics: [math]
  Statistics: [math]
  Department of Statistics: [math]
