  - <<: *bayarea
    id: bayarea-litp
    name: Leinweber Institute for Theoretical Physics (LITP, formerly SITP) seminars
    adapter: drupal_jsonapi
    url: https://sitp.stanford.edu/jsonapi/node/hs_event
    homepage: https://sitp.stanford.edu/events/sitp-seminar-schedule
    institution: stanford
    host_org: Leinweber Institute for Theoretical Physics
    default_fields: [physics]
    default_event_type: seminar
    params:
      # The request scheme, field list and mapping of the template A sources in
      # config/sources.d/stanford-sites.yaml ("x-hs-jsonapi-params"), repeated here
      # because YAML anchors do not reach across files. One addition: the speaker's
      # affiliation is the site's own attribute custm_speaker_affiliation, so it is
      # appended to fields[node--hs_event]. The fixture hs-event-window.json holds
      # exactly the request this builds for the window of 2026-11-11.
      page_limit: 50
      max_pages: 4
      sort: [field_hs_event_date.value, drupal_internal__nid]
      window_filter:
        path: field_hs_event_date.value
        value_format: unix_seconds
      include:
        - field_hs_event_speaker
        - field_hs_event_series
        - field_hs_event_type
        - field_hs_event_status
        - field_hs_event_category
        - field_hs_event_audience
      fields:
        node--hs_event:
          - title
          - path
          - body
          - status
          - changed
          - field_hs_event_date
          - field_hs_event_instances
          - field_hs_event_location
          - field_hs_event_map_link
          - field_hs_event_link
          - field_hs_event_stream
          - field_hs_event_stream_info
          - field_hs_event_experience
          - field_hs_event_sponsor
          - field_hs_event_admission
          - field_hs_event_registration
          - field_hs_event_speaker
          - field_hs_event_series
          - field_hs_event_type
          - field_hs_event_status
          - field_hs_event_category
          - field_hs_event_audience
          - custm_speaker_affiliation
        hs_entity--event_collections__speaker: [label]
        node--hs_event_series: [title, path]
        taxonomy_term--hs_event_type: [name]
        taxonomy_term--hs_event_status: [name]
        taxonomy_term--hs_event_category: [name]
        taxonomy_term--hs_event_audience: [name]
      # Speakers: the included hs_entity--event_collections__speaker labels hold the
      # name only ("Sean Hartnoll"); custm_speaker_affiliation of the event is the
      # affiliation ("University of Cambridge"). Each of the 9 events of the institute
      # in the sample has exactly one speaker; the imports have none.
      speaker_affiliation_attribute: custm_speaker_affiliation
      event_type_names:
        LITP Seminars: seminar
        LITP Monday Colloquia: colloquium
        Friday Phenomenology Group Seminars: seminar
        Colloquia: colloquium
      status_names: {live: confirmed, Published: confirmed, canceled: cancelled}
      title_status_pattern: '(?i)\b(cancell?ed|postponed)\b'
      title_status_names: {canceled: cancelled, cancelled: cancelled, postponed: cancelled}
      localist_link_prefix: https://events.stanford.edu/event/
      # Drop every event whose field_hs_event_link.uri starts with localist_link_prefix.
      # These are imports from the Stanford Events calendar: here all 5 of them are the
      # Applied Physics/Physics Colloquium, which the Localist source and the physics
      # department site already list (3 carry the series "Applied Physics/Physics
      # Colloquia", 2 no series at all, so a series filter alone would miss them).
      exclude_localist_imports: true
    research:
      verified: 2026-11-11
      sample_events: 14
      has_rss: false
      has_ics: false
      has_jsonld: false
      has_jsonapi: true
      extraction: api
      crawl_delay: 30
      template: A
      requests_per_run: 1
      series_seen:
        - LITP Seminars
        - LITP Monday Colloquia
        - Friday Phenomenology Group Seminars
        - Applied Physics/Physics Colloquia
      notes:
        - Found through the SITP link on theory.slac.stanford.edu; not in the seed list.
          It is a Stanford H&S department site (template A) and fits the stanford-sites
          group better; it is kept here with the same request scheme so that moving it
          only changes its id and group.
        - '14 events in the window of 2026-11-11 (2026-10-30 to 2027-02-23), one page:
          9 of the institute itself (LITP Seminars, LITP Monday Colloquia, Friday
          Phenomenology Group Seminars) and 5 imported Applied Physics/Physics
          Colloquia (status term "live", field_hs_event_link on events.stanford.edu).'
        - The 9 own events have a speaker relationship and custm_speaker_affiliation;
          the type term "Colloquia" is set on one Monday colloquium only.
        - Rooms are Varian 355 and Varian 312; imported events have three lines joined
          with CR LF.
        - /events/all/rss is 404.

  # --- CZ Biohub --------------------------------------------------------------------

  - <<: *bayarea
    id: bayarea-biohub
    name: Biohub events
    adapter: html_list
    url: https://biohub.org/events/
    homepage: https://biohub.org/events/
    institution: biohub
    host_org: Biohub
    default_fields: [bio]
    default_event_type: conference
    params:
      # Selectors in the html_list form of config/sources.d/stanford-custom.yaml
      # (selectors.item plus one selector per field), plus a detail_page block. The
      # item selector takes only the upcoming block; the page lists past events below
      # it (ul.content-type-past_events, 12 cards).
      # The upcoming block is often empty between events: that is a page without
      # items, not a broken page (html_list allow_empty), as long as the past events
      # are still listed with the same cards. A page without any card of either block
      # was redesigned or replaced, and that is a parse error.
      allow_empty: true
      empty_marker: 'ul.content-type-past_events li.multisite-query-loop-item'
      selectors:
        item: 'ul.content-type-events li.multisite-query-loop-item'
        title: 'h3.card-title'
        link: '.card-button a'
        date: '.wp-block-heading-event-date'  # "November 18, 2026": no time of day
        region: '.wp-block-post-date'  # "San Francisco Bay Area", "Other Locations"
        summary: 'p.card-excerpt'
      link_attribute: href
      # Order of work for every card: first apply exclude_regions and the skip_*
      # patterns, then require a link, and only then fetch the detail page. A card
      # without a link (the "(Invite Only)" symposium has none) is dropped. Links to
      # other hosts (booth cards point to ascb.org and neurips.cc) are never fetched:
      # the skip patterns drop those cards first, and a remaining card whose link is
      # not on biohub.org is dropped as well.
      exclude_regions: [Chicago, New York]
      skip_title_patterns: ['\(Invite Only\)']
      skip_summary_patterns: ['will be at booth']
      require: [title, link]
      # Times are only on the detail page; a card whose detail page fails is dropped
      # for this run. The source then counts as not read in full in that run: the run
      # report warns, the stored events the source did not deliver are not counted as
      # missing, and three such runs in a row open a source-broken issue.
      detail_page:
        times: '.event-meta--date-time-location time[datetime]'  # first = start, second = end
        location: '.event-meta__value--location'  # "Zoom", "San Francisco, CA (...)"
        # Native id: the WordPress post id from the shortlink "https://biohub.org/?p=52744"
        # (also the body class postid-52744); it stays when the slug changes.
        native_id: 'link[rel="shortlink"]'
        native_id_attribute: href
        native_id_pattern: '[?&]p=(?P<native_id>\d+)'
        # Speakers: the person cards of the section whose heading names speakers
        # ("Speakers", "Keynote Speaker"): .people-list-item (name and affiliation) or,
        # for a keynote, .people-featured (a name and a bio). The recorded keynote card
        # has no affiliation element, but the theme's stylesheet in that page styles
        # .people-featured__affiliation, so a card that has one is read. The list
        # cards never name a speaker. A conference page uses the same cards for its
        # "Scientific Organizers", who are no speakers, so a bare .people-list-item
        # would be wrong.
        speaker: >-
          .wp-block-group:has(> h2:lexbor-contains("speaker" i))
          :is(.people-list-item, .people-featured)
        speaker_name: '.people-list-item__name, .people-featured__name'
        speaker_affiliation: '.people-list-item__affiliation, .people-featured__affiliation'
      title_event_types:
        Webinar: seminar
        Symposium: conference
        Conference: conference
        Workshop: workshop
    research:
      verified: 2026-11-11
      sample_events: 1
      has_rss: true
      has_ics: false
      has_jsonld: false
      has_jsonapi: false
      extraction: html
      crawl_delay: 0
      requests_per_run: 2  # the list and one detail page per kept upcoming card
      notes:
        - Canonical host biohub.org (www.czbiohub.org redirects here).
        - One upcoming event (an online webinar on 2026-11-18) and 12 past cards on the
          list; the list's year filter goes back to 2018.
        - JSON-LD is the Yoast WebPage graph only, no schema.org/Event.
        - wp-json is closed to anonymous users (401 rest_not_logged_in on /wp-json/).
        - /feed/?post_type=event is a 527 KB RSS of 36 items (33 of them with an
          /events/ link), mostly symposia, conferences and webinars; pubDate is the
          publication date and there is no event date, so it is not usable.
        - The GET filter events-event_type=... works for past events but empties the
          upcoming block, so the list is fetched unfiltered.
        - Region labels are San Francisco Bay Area, Chicago, New York, Other Locations
          (online webinars and outside conferences such as NeurIPS booths).
