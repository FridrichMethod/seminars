# Bay Area institutes: SLAC National Accelerator Laboratory and the SLAC-Stanford
# series linked from its seminar index, CZ Biohub, and (no source) Arc Institute.
# Schema of one entry: seminars.models.SourceConfig. Researched on 2026-11-11; every
# URL below was requested through the project's polite client and recorded under
# tests/fixtures/<id>/ (see the README.md there for markup details).
#
# research.crawl_delay 0 means robots.txt sets none (the client still waits 1 s).
#
# Adapters that do not exist yet are named after the module that should define them
# (research.proposed_adapter says "custom:<module>" for those); the registry checks
# the name at run time, not at load time.
#
# Stanford Sites standard template (template B, class prefix "su-event-"): the sources
# bayarea-kipac, bayarea-pulse, bayarea-glam and bayarea-qfarm. Their params use the keys
# and selectors of the template B block ("x-su-event-params") of
# config/sources.d/stanford-sites.yaml, so that one rss adapter reads every template B
# site. YAML anchors do not reach across files, so the block is repeated below; every
# selector in it was checked on the recordings of all four sources (KIPAC 3 pages of
# 20 cards, PULSE 3, GLAM 8, Q-FARM 20 cards). How a card maps to a draft (location,
# else the address with its lines joined by ", "; date-only times for all-day events;
# links with external_link_class) is as described under that block. What differs from
# it, for all four sources:
#
# - The list page is the primary record (list_page.primary). These lists run months
#   ahead (KIPAC to May 2027, Q-FARM to June 2027), while the feed holds only the next
#   10 items and ignores ?page=N (page 1 of the KIPAC feed is byte-identical to page 0).
#   Every list card whose start lies in the run window becomes one draft, whether or
#   not the feed has an item for it; a feed item without a card is dropped (Q-FARM
#   lists a stray copy of one talk). A card and a feed item still join on title and
#   start, but the feed adds nothing that the card lacks.
# - Identity: feed.native_id is "none", so the key of an event is the source plus its
#   detail URL (site root plus the href of the card), the one key that every card has.
#   With the feed guid as native id only the next 10 items would have one, and every
#   later event would change its key on the day it enters the feed. The URL key has a
#   risk of its own: the URL alias follows the title ("/events/cmp-seminar/coming-
#   soon-4"), so a site that renews the alias when a TBA title is filled in changes
#   the key; start time and speaker stay the same then.
# - Paging (list_page.pager, max_list_pages per source): fetch the list, then the page
#   that the "Load More Events" link names (?page=1, ?page=2, ...), and stop at the
#   first page that has no such link, has no card, or whose last card starts at or
#   after the window end, or after max_list_pages pages.
# - detail_page.fetch is "never": no detail page of these sites was recorded, and a
#   card has everything but the abstract.
# - Per source: event_type_names, card_fields (which part of a card holds which field;
#   type_card_fields for one card type only), speaker_patterns (regular expressions
#   tried in order; the first one that matches is applied repeatedly, re.finditer,
#   and each match is one speaker with the named groups speaker and affiliation,
#   stripped), title_patterns (named groups series and title) and tba_title_patterns
#   (a title that only names the series: the talk has no title yet). A card type in
#   exclude_types is dropped. series_from: type means that the card type is the series.

x-bayarea: &bayarea
  group: bayarea
  timezone: America/Los_Angeles

x-su-event-params: &su-event-params
  feed:
    # <title> holds unescaped markup: <h2><a href="/events/...">Title</a></h2>.
    title_is_markup: true
    start: pubDate  # the start, with offset; 00:00 for an all-day event
    native_id: none  # stanford-sites uses guid here; see above
  list_page:
    item: 'div.view.stanford-events:not(.past-events-list-block) article.su-event-list-item'
    title: 'h3 a'
    link: 'h3 a'  # href: a path on the site, or an absolute URL elsewhere
    external_link_class: su-link--external
    type: '.su-event-type a'
    times: 'time[datetime]'  # first is the start, second (if any) the end; a date only means all day
    location: '.views-field-su-event-location'
    address: '.views-field-su-event-address'
    subheadline: '.event-list-item__subheadline'
    dek: '.event-list_item__dek'
    join_on: [title, start]
    primary: true
    pager: '.js-pager__items a[href^="?page="]'  # "Load More Events"
  detail_page:
    fetch: never

# Series that were looked at and are NOT collected, with the reason. Kept here so that
# nobody has to repeat the research. The loader ignores top-level "x-" keys.
x-not-collected:
  - series: SLAC Accelerator Seminar
    url: https://indico.slac.stanford.edu/category/121/
    reason: >-
      the Indico category lists no talk. robots.txt of the host disallows every
      path; a source for it would set ignore_robots as bayarea-slac-theory does.
  - series: AI at SLAC Seminar
    url: https://confluence.slac.stanford.edu/display/AI/AI+Seminar
    reason: >-
      confluence.slac.stanford.edu is not reachable from outside (robots.txt
      unreachable, the client skips the host); the wiki is staff-facing.
  - series: Advanced Instrumentation Seminars (AIS)
    url: https://www-group.slac.stanford.edu/ais/default.asp
    reason: dormant, the "next seminar" is from 2019-09-10 (bayarea-slac-ais, disabled).
  - series: SIMES events
    url: https://simes.stanford.edu/
    reason: >-
      no events section; /events is 404 and /events/all/rss is an empty channel.
  - series: SLAC Photon Science Seminar (SSRL page)
    url: https://www-ssrl.slac.stanford.edu/ssrl/web/outreach/events/photon-science-seminar-series
    reason: >-
      the page says the Stanford PULSE Institute now publishes these events; they are
      collected by bayarea-pulse. The index link /content/events/... is a 404.
  - series: KIPAC calendar ICS
    url: https://s3df.slac.stanford.edu/data/kipac/calendar/events.ics
    reason: >-
      served as application/octet-stream, which the HTTP client refuses as binary;
      bayarea-kipac uses the RSS and the list page instead.
  - series: Applied Physics/Physics Colloquium
    url: https://physics.stanford.edu/news-events/applied-physicsphysics-colloquium
    reason: >-
      covered elsewhere: the Stanford Physics department site (stanford-sites group)
      imports it from the Stanford Events calendar (localist group). bayarea-kipac
      lists it too (type "AP/Physics Colloquium", linking to physics.stanford.edu)
      and drops it through exclude_types; bayarea-litp has the same talks as imports
      from events.stanford.edu and drops them through exclude_localist_imports.
  - series: SUNCAT Center for Interface Science and Catalysis events
    url: https://suncat.stanford.edu/events
    reason: >-
      no public seminar at present (source bayarea-suncat, disabled): the "Seminars"
      list is empty, and the 6 upcoming entries are internal group meetings (tag
      "Group meetings", title = speaker name, no abstract). SUNCAT is not a
      department of the Stanford Events calendar, so nothing else covers it.
  - series: Stanford Energy Seminar and Precourt Institute for Energy events
    url: https://energy.stanford.edu/news-events/events/upcoming-events
    reason: >-
      covered elsewhere (localist group). The SLAC index links
      energy.stanford.edu/energy-seminar/... and /events/upcoming-events (which
      redirects to /news-events/events/upcoming-events, Crawl-delay 30). All 42
      upcoming cards there link to events.stanford.edu (8 distinct events; 35 cards
      are dates of one "Understand Energy Staff Learning Series"), and the Stanford
      Events recording of the localist group holds the Energy Seminar of 2026-11-09
      and 2026-11-16 under the department "Precourt Institute for Energy".
  - series: TomKat Center for Sustainable Energy events
    url: https://tomkat.stanford.edu/events
    reason: >-
      no events: the page says "No events at this time" (2026-11-11, Crawl-delay
      30). "TomKat Center for Sustainable Energy" is a department of the Stanford
      Events calendar (no event of it in the localist recording).
  - series: Stanford Doerr School of Sustainability events
    url: https://sustainability.stanford.edu/about-school/news-and-events
    reason: >-
      covered elsewhere (localist group). The link of the SLAC index redirects to
      the school's news page (/news/, WordPress, no event list); the school's events
      are on the Stanford Events calendar under the department "Stanford Doerr School
      of Sustainability" (three in the localist recording: a finance workshop for
      students, a lecture on Indigenous guardianship and an environmental behavioural
      science seminar).
  - series: Arc Institute seminars
    url: https://arcinstitute.org/
    reason: >-
      no public seminar calendar. /events and /seminars are 404, the sitemap
      (sitemap-0.xml, every public page) has no events page, and the only mention is
      the internal "Arc's seminar series" on /programs/innovation-investigators.

sources:
  # --- SLAC -----------------------------------------------------------------------

  - <<: *bayarea
    id: bayarea-slac-colloquium
    name: SLAC Colloquium Series
    adapter: slac_drupal
    url: https://colloquium.slac.stanford.edu/upcoming-events
    homepage: https://colloquium.slac.stanford.edu/
    institution: slac
    host_org: SLAC National Accelerator Laboratory
    default_fields: [physics]
    default_event_type: colloquium
    series: SLAC Colloquium
    params:
      # The list gives the detail links; each detail page embeds an "iCal" link whose
      # href is a data:text/calendar URI with one VEVENT (UID, SUMMARY, DTSTART and
      # DTEND with TZID=America/Los_Angeles, DESCRIPTION).
      #
      # Identity: the VEVENT UID (a UUID) is the native id of every event. A card whose
      # detail page cannot be fetched, has no VEVENT, or lies beyond max_detail_pages
      # is dropped for this run, never emitted under a fallback key: the slug of the
      # detail URL contains the title ("2026-10-22-talk-phil-bucksbaum"), so a URL key
      # would change when a TBA talk gets its title. When its detail page could not be
      # fetched, the source counts as not read in full in that run: the run report
      # warns, the stored events the source did not deliver are not counted as
      # missing, and three such runs in a row open a source-broken issue.
      #
      # Times: DTSTART and DTEND of the VEVENT. Resolve TZID=America/Los_Angeles with
      # zoneinfo and ignore the embedded VTIMEZONE: it has a STANDARD component only
      # (-0800), so a parser that trusts it would put every summer talk an hour off.
      # All recorded events fall in PST, so no fixture shows the difference. The
      # "Outlook" link of the page carries the same times in UTC (startdt=...Z,
      # enddt=...Z) and can serve as a cross-check; so can the card date text.
      # The DESCRIPTION repeats the abstract and ends with " Link to event page: <url>";
      # the detail abstract below is preferred, the DESCRIPTION without that tail is
      # the fallback.
      native_id: vevent_uid
      list:
        card: div.c-view__row div.c-card
        title: h3.c-card__title a
        link: h3.c-card__title a
        speaker: .slac-speaker .speaker-name
        affiliation: .slac-speaker .speaker-affiliation
        abstract: .c-field--name-field-body
        date_text: .c-card__date
        # "Kavli Auditorium" or "Kavli Auditorium and zoom" on past cards (after an icon
        # titled "Location"); the upcoming cards leave it out.
        location: .c-card__location
        # "No items to display." when no talk is scheduled (seen on the Theory Group
        # site, which runs the same theme): the list is empty, not broken.
        empty: div.c-view__empty
      # The home page: "Currently, the talks are in the hybrid format ... The in-person
      # part takes place at the Kavli Auditorium". A card that names no place gets
      # that, in the words of the past cards, which normalization reads as hybrid (in
      # the room and online).
      default_location: Kavli Auditorium and Zoom
      detail:
        # Below the event, every detail page shows the cards of 3 OTHER events in this
        # block (div.c-card with .c-card__date and .c-field--name-field-body, the same
        # classes as on the list). No detail selector may read a match inside it.
        exclude: div.c-view--pre-filtered-content-lists
        ical_link: a[href^="data:text/calendar"]
        title: .c-page-title h1
        # "Kate Scholberg" or "Hemamala (Hema) Karunadasa, Stanford Univerisity" (name,
        # then ", " and the affiliation); present on 2 of the 5 recorded pages, missing
        # on the placeholder and on the "Talk by ..." pages.
        speaker: .c-page-title .c-lede
        # Starts with "Abstract: " on talks; "Info coming soon!" on TBA talks.
        abstract: .event-detail__content .c-wysiwyg
      max_detail_pages: 12
      # "No SLAC Colloquium 11/23" marks a week without a talk.
      skip_title_patterns: ["^No (SLAC )?Colloquium\\b"]
      # "Talk by <name>" with "Info coming soon!" is a talk without a title yet; the
      # group names its speaker, who is on neither the card nor the detail page.
      tba_title_patterns: ["^Talk by (?P<speaker>.+)$"]
      # The abstract of such a talk; it is no abstract.
      tba_abstract_patterns: ["^Info coming soon\\b"]
    research:
      verified: 2026-11-11
      sample_events: 4
      has_rss: false
      has_ics: true
      has_jsonld: false
      has_jsonapi: false
      extraction: html
      crawl_delay: 0
      proposed_adapter: custom:slac_drupal
      template: SLAC Drupal 10 theme (c-card)
      # the list and one detail page per card in the window, except for skipped
      # placeholders (5 on 2026-11-11)
      requests_per_run: 5
      notes:
        - 5 cards on the list, one of them the "No SLAC Colloquium 11/23" placeholder.
        - /jsonapi is 404 (JSON error document); no RSS link in the page head.
        - The VEVENT is embedded per detail page, there is no ICS feed URL.
        - The upcoming cards and the detail pages name no place. Past cards have one in
          .c-card__location ("Kavli Auditorium", "Kavli Auditorium and zoom"; 6 of the 9
          cards on /past-events), and the home page says that the talks are hybrid and
          that their in-person part takes place at the Kavli Auditorium, hence
          default_location.
        - Card date text looks like "Monday, November 16, 2026", a middle dot,
          "4:00 p.m.", an en dash, "5:00 p.m.", two no-break spaces, "PT"; the text of
          .c-card__date also starts with "Date", the title of its SVG icon.
        - A speaker is on 2 of the 5 cards, a non-empty affiliation on 1 of them; the
          TBA talks name the speaker only in the title ("Talk by Phil Bucksbaum").
        - The embedded VTIMEZONE claims -0800 all year (no DAYLIGHT part); use zoneinfo
          for TZID=America/Los_Angeles.
        - Monday 16:00 PT, roughly weekly; topics span all of SLAC science.

  - <<: *bayarea
    id: bayarea-slac-theory
    name: SLAC Theory Group seminars (EPP Theory)
    adapter: ics
    # The category export of Indico. theory.slac.stanford.edu/events is empty and
    # sends readers here.
    url: https://indico.slac.stanford.edu/category/129/events.ics
    homepage: https://indico.slac.stanford.edu/category/129/
    # robots.txt of indico.slac.stanford.edu is "User-agent: * / Disallow: /". The
    # owner chose to fetch this public feed anyway: one request per run.
    ignore_robots: [indico.slac.stanford.edu]
    institution: slac
    host_org: SLAC Theory Group
    default_fields: [physics]
    series: SLAC Theory Seminar
    params:
      # DESCRIPTION: "Speakers: Federico Cima (Caltech)", a blank line, the abstract, a
      # blank line and the address of the Indico event. A talk without an abstract
      # yet has the speaker line and the address only; a talk without a speaker line
      # names the speaker in its title ("Debopam Goswami: Producing the ...").
      property_fields: {DESCRIPTION: null}
      patterns:
        DESCRIPTION:
          - '\ASpeakers: (?P<speaker>[^()\n]+?) \((?P<affiliation>[^()\n]+)\)\n'
          - '\ASpeakers: [^\n]*\n\n(?P<abstract>[\s\S]+?)\n\nhttps://indico\.slac\.stanford\.edu/event/\d+/\s*\Z'
    research:
      verified: 2026-11-16
      sample_events: 11
      has_rss: false
      has_ics: true
      has_jsonld: false
      has_jsonapi: false
      extraction: feed
      crawl_delay: 0
      robots: "indico.slac.stanford.edu: User-agent * / Disallow / (every path); ignored, see ignore_robots"
      notes:
        - The feed lists the talks from about four weeks back on (2026-10-21 to 2026-11-25 in the recording), Wednesdays and Fridays at 12:30 PT, most in 48/2-224 Madrone.
        - Talks that have no title yet are called "TBA".
        - The recordings of theory.slac.stanford.edu (empty upcoming list, past events) stay in the fixture directory as test material for the slac_drupal adapter.

  - <<: *bayarea
    id: bayarea-slac-experimental
    name: SLAC Experimental Seminar Series
    adapter: ics
    url: https://indico.slac.stanford.edu/category/14/events.ics
    homepage: https://indico.slac.stanford.edu/category/14/
    # robots.txt of indico.slac.stanford.edu disallows every path, as for
    # bayarea-slac-theory; the owner chose to fetch this public feed: one request per run.
    ignore_robots: [indico.slac.stanford.edu]
    institution: slac
    host_org: SLAC
    default_fields: [physics]
    series: SLAC Experimental Seminar
    params:
      # DESCRIPTION: "Speakers: Jiayi Chen (Simon Fraser University)", a blank line, the
      # abstract, then the Zoom address and the address of the Indico event, each after
      # a blank line (the first one holds a no-break space). A talk without a speaker
      # yet has "TBA" in place of the speaker line and the abstract. The abstract stops
      # before the Zoom address, which holds the meeting password.
      property_fields: {DESCRIPTION: null}
      patterns:
        DESCRIPTION:
          - '\ASpeakers: (?P<speaker>[^()\n]+?) \((?P<affiliation>[^()\n]+)\)\n'
          - '\ASpeakers: [^\n]*\n\n(?P<abstract>[\s\S]+?)\n[^\S\n]*\n(?:https?://\S+\n[^\S\n]*\n)*https://indico\.slac\.stanford\.edu/event/\d+/\s*\Z'
    research:
      verified: 2026-11-16
      sample_events: 5
      has_rss: false
      has_ics: true
      has_jsonld: false
      has_jsonapi: false
      extraction: feed
      crawl_delay: 0
      robots: "indico.slac.stanford.edu: User-agent * / Disallow / (every path); ignored, see ignore_robots"
      notes:
        - The feed lists the talks from about four weeks back on (2026-10-20 to 2026-11-24 in the recording), Tuesdays at 12:30 PT, some in Varian 355 at Stanford, all with the same Zoom meeting.
        - Talks that have no speaker yet are called "TBA" and have "TBA" as description.

  - <<: *bayarea
    id: bayarea-slac-workshops
    name: SLAC workshops and schools
    adapter: ics
    # The category exports of the public workshop categories of Indico, one feed each:
    # 170 RL4AA, 171 SSRL Workshops, 20 QIS Workshop, 16 SLAC Summer Institute and 19
    # ML@SLAC Workshop. Not the parent category 5, whose feed takes in the weekly
    # CIDeR-ML General Meetings of category 110 (internal, with Zoom links), and not
    # categories 129 and 14, the seminars of bayarea-slac-theory and
    # bayarea-slac-experimental.
    url: https://indico.slac.stanford.edu/category/170/events.ics
    urls:
      - https://indico.slac.stanford.edu/category/171/events.ics
      - https://indico.slac.stanford.edu/category/20/events.ics
      - https://indico.slac.stanford.edu/category/16/events.ics
      - https://indico.slac.stanford.edu/category/19/events.ics
    homepage: https://indico.slac.stanford.edu/category/5/
    # robots.txt of indico.slac.stanford.edu disallows every path, as for
    # bayarea-slac-theory; the owner chose to fetch these public feeds: five requests
    # per run.
    ignore_robots: [indico.slac.stanford.edu]
    institution: slac
    host_org: SLAC National Accelerator Laboratory
    default_fields: [physics]
    # The feeds give no event type; the categories hold workshops and a school. One that
    # runs over several days or for at least three hours is a meeting, and
    # meeting_horizon keeps it up to a year ahead.
    default_event_type: workshop
    meeting_horizon: true
    params:
      # DESCRIPTION: an optional line "Speakers: Name (Affiliation), Name (Affiliation),
      # ...", blank lines, the description of the event and, after a blank line, the
      # address of the Indico event. The abstract is the description alone. The speaker
      # line of a workshop lists its organisers and speakers, which a pattern cannot
      # split (it sets one speaker), and its names would count as keywords of a field
      # ("Dula Parkinson" for med). An event with a speaker line and no description has
      # no abstract.
      property_fields: {DESCRIPTION: null}
      patterns:
        DESCRIPTION:
          - '\A(?:Speakers: [^\n]*\n\s*)?(?P<abstract>(?!Speakers: )\S[\s\S]*?)\s*\nhttps://indico\.slac\.stanford\.edu/event/\d+/\s*\Z'
    research:
      verified: 2026-11-18
      sample_events: 3
      has_rss: false
      has_ics: true
      has_jsonld: false
      has_jsonapi: false
      extraction: feed
      crawl_delay: 0
      robots: "indico.slac.stanford.edu: User-agent * / Disallow / (every path); ignored, see ignore_robots"
      requests_per_run: 5
      notes:
        - The export of a category lists the events of the category and its subcategories that ended at most four weeks before the request, with no upper bound, so a feed already holds the meetings of next year.
        - 170 RL4AA holds RL4AA'27 (2027-04-20 to 04-23, free, places limited); 171 SSRL Workshops holds "Re-envisioning X-ray Science in the Age of SI and Automation" (2026-12-09 to 12-10, hybrid); 20 QIS Workshop holds "Q-NEXT All Hands 2027" (2027-03-16 to 03-17), a meeting of the Q-NEXT center that the taxonomy drops as administrative ("all-hands"); its last public workshop was RISQ26 (June 2026).
        - '16 SLAC Summer Institute (under 13, "Schools, Seminars and Courses") is empty: SSI 2026 (2026-08-10 to 08-14) has ended and the next institute is not listed yet. 19 ML@SLAC Workshop is empty, its last event the ML Initiatives School of December 2021; it stays for the next one, at one request.'
        - The other public subcategories of 5 (AD, Astronomy, HEP, ICALEPCS, LCLS, NP and TID workshops, SLAC Colloquium, Faculty Retreat, SLACmass, Snowmass, Graduate Student Orientation, US-Japan Meeting) were not looked at and are not collected.
        - The feeds give no event type, CATEGORIES, registration or abstract deadline. DTSTART and DTEND are in UTC; LOCATION is "<room> (<venue>)" or "SLAC"; CONTACT holds an e-mail address, which the adapter does not read.
        - DESCRIPTION is free text. A Zoom link of a hybrid workshop in it loses its password in normalization (pipeline/privacy.py); none of the recorded events has one.

  - <<: *bayarea
    id: bayarea-slac-ais
    name: SLAC Advanced Instrumentation Seminars (AIS)
    adapter: llm_page
    # Off: dormant, the "next seminar" on the page is from 2019-09-10.
    enabled: false
    url: https://www-group.slac.stanford.edu/ais/default.asp
    institution: slac
    host_org: SLAC National Accelerator Laboratory
    default_fields: [physics]
    series: Advanced Instrumentation Seminar
    research:
      verified: 2026-11-11
      sample_events: 0
      has_rss: false
      has_ics: false
      has_jsonld: false
      has_jsonapi: false
      extraction: llm
      crawl_delay: 0
      notes:
        - Disabled. Classic ASP page whose "Next Seminar" is still Tuesday,
          September 10, 2019; the series has not been updated since.

  - <<: *bayarea
    id: bayarea-kipac
    name: KIPAC Seminars and Events
    adapter: rss
    url: https://kipac.stanford.edu/events/all/rss
    urls:
      - https://kipac.stanford.edu/events/upcoming-events
    homepage: https://kipac.stanford.edu/events
    institution: slac
    host_org: Kavli Institute for Particle Astrophysics and Cosmology (KIPAC)
    default_fields: [physics]
    default_event_type: seminar
    params:
      <<: *su-event-params
      # 3 pages cover the window of 2026-11-11: page 0 ends on 2026-12-11, page 1 on
      # 2027-02-25, page 2 runs to 2027-05-13, past the window end (2027-03-12).
      max_list_pages: 3
      series_from: type
      event_type_names:
        Astrophysics Colloquium: colloquium
        KIPAC Seminar: seminar
        KIPAC Tea Talk: seminar
        KIPAC Workshops: workshop
      # "Other" is social (patio time, Friendsgiving, BBQ). "AP/Physics Colloquium"
      # cards link off the site to physics.stanford.edu; that colloquium comes from the
      # physics department site and the Stanford Events calendar.
      exclude_types: [Other, AP/Physics Colloquium]
      # The dek repeats the location; .views-field-su-event-location has the same text.
      card_fields: {speakers: subheadline}
      # "Ava Polzin (Univ. of Toronto)", "Chenze Dong (Kavli IPMU) / Aniruddh Herle
      # (Leiden Observatory)", "Zorawar Wadiasingh (GSFC / UMD)": one match per speaker;
      # a " / " inside the brackets belongs to the affiliation. One tea talk names a
      # group sharing one affiliation: "Xinnan Du, Alex Mitchell, Leo Sajkov, and Toby
      # Satterthwaite (KIPAC)"; split such a speaker group on ", " and ", and ".
      speaker_patterns:
        - '(?P<speaker>[^()/]+?)\s*\((?P<affiliation>[^()]*)\)'
      # Most titles repeat the series in front: "KIPAC Tea Talk: <title>".
      title_patterns:
        - '^(?P<series>KIPAC Seminar|KIPAC Tea Talk|Astrophysics Colloquium):\s*(?P<title>.+?)\s*$'
      # The bare series name means that the talk has no title yet.
      tba_title_patterns: ['^(?:KIPAC Seminar|KIPAC Tea Talk|Astrophysics Colloquium)$']
    research:
      verified: 2026-11-11
      sample_events: 60
      has_rss: true
      has_ics: true
      has_jsonld: false
      has_jsonapi: false
      extraction: feed
      crawl_delay: 30
      template: B
      requests_per_run: 4
      notes:
