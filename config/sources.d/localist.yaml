        "Department of Surgery": [med]
        "Department of Cardiothoracic Surgery": [med]
        "Department of Neurosurgery": [med]
        "Dept of Otolaryngology Head & Neck Surgery": [med]
        "Department of Dermatology": [med]
        "Department of Neurology": [med]
        "Department of Psychiatry": [med]
        "Psychiatry & Behavioral Sciences": [med]
        "Stanford Psychiatry and Behavioral Sciences": [med]
        "Department of Radiology": [med]
        "Department of Radiation Oncology": [med]
        "Department of Epidemiology & Population Health": [med]
        "Pediatrics": [med]
        # The calendar itself cuts the next name off after "Regenerative".
        "Department of Pediatrics/Division of Stem Cell Transplantation and Regenerative": [med]
        "Department of Pediatrics/Palliative Care & Critical Care Medicine": [med]
        "Division of Pediatric Infectious Diseases": [med]
        "Pediatric Pulmonary": [med]
        "School of Medicine, Ob/Gyn Department": [med]
        "Division of Clinical Anatomy": [med]
        "Byers Eye Institute at Stanford": [med]
        "Office of Pediatric Education": [med]  # posts the Pediatric Grand Rounds
        # School of Medicine: clinical and translational centers and programs
        # Clinician courses, not talks: out of scope by the owner's choice (2026-11-11);
        # config/taxonomy.yaml lists the category under out_of_scope_categories.
        "Stanford Center for Continuing Medical Education": []
        "Stanford Cancer Center": [med]
        "Asian Liver Center": [med]
        "California Perinatal Quality Care Collaborative": [med]
        "Center for Asian Health Research and Education": [med]
