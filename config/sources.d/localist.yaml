        "Center for Population Health Sciences": [med]
        "Clinical Excellence Research Center (CERC)": [med]
        "Down Syndrome Research Center": [med]
        "Dunlevie Maternal-Fetal Medicine Center": [med]
        "Integrative Biomedical Imaging Informatics (IBIIS)": [med]
        "Maternal and Child Health Research Institute": [med]
