      # groups[].name of a record -> EventDraft.field_hints, like department_fields. Only
      # about 1% of the records have the key "groups" at all; nearly all of the 400 groups
      # (fixtures groups-page1..4.json) are student organizations and give no hint.
      group_fields:
        "Biomedical Informatics": [bio, med]
        "Center of AI Safety (SAFE)": [ai-ml]
        "Stanford Intelligent Systems Lab": [ai-ml]

    research:
      verified: 2026-11-11
      sample_events: 477
      has_rss: true
      has_ics: true
      has_jsonld: true
      extraction: api
      crawl_delay: 1
      api: Localist API v2 (JSON), https://developer.localist.com/doc/api
      window: 2026-10-28 to 2027-03-12 (the 135 days of the default time window)
      events_all_types: 2252
      events_talk_types: 477
      events_untyped: 139
      requests_per_run: 7
      departments_total: 736
      groups_total: 400
      notes:
        - >-
          Volume in the default window: 477 records with one of the five talk-like types
          (432 distinct events), 139 records without any type, 2252 records of all types.
          With pp=100 one run needs 5 + 2 requests of up to 700 KB each.
        - >-
          Fields of a record (events[].event): id, title, description_text (plain text),
          description (HTML), location_name, room_number, address, experience (inperson,
          hybrid or virtual), stream_url, stream_info (HTML joining instructions, never
          copied, see below), url, localist_url, status, filters.event_types,
          filters.event_subject, filters.event_audience, departments[].{id, name},
          groups[].{id, name}, event_instances[0].event_instance.{id, event_id, start, end,
          all_day}. A filter family is missing when the event has no item of it.
        - >-
          start carries the UTC offset (2026-11-10T15:30:00-08:00). end is null for 51 of
          the 477 records: 30 timed events and 21 all-day events.
        - >-
          All-day events (25 of 477): start is local midnight and end is null, or 23:59 of
          the same day. Every day of an event that lasts several days is an instance of its
          own with its own id, so an all-day draft always covers one day.
        - >-
          experience says whether an event is online: 288 inperson, 110 virtual, 79 hybrid.
          stream_url is set on 58 records and 15 of those carry a meeting password in the
          query (pwd=...), which normalization has to drop.
        - >-
          Meeting passcodes are not only in stream_url. stream_info is an HTML field with
          the joining instructions: a Zoom link with pwd=..., "pwd=..." as plain text after
          the link, "Password:", "Passcode:" or "Password if prompted:" followed by the
          code. Never copy stream_info into any field of a draft. description and
          description_text can hold the same: a Zoom link with pwd=... and "(passcode:
          ...)" in the text that becomes the abstract. Links that carry a credential (pwd,
          passcode, tk, token) and written-out passcodes have to be removed from the
          abstract as well, not only from stream_url. Fixture records (values replaced by
          placeholders): stream_info of 54445649547777, 54435561022415 (pwd as plain text),
          54420408876947 and 54435582365420; description of 54420408876947 and
          54294379845960; description_text of 54420408876947 (link) and 54294379845960
          (written-out passcode).
        - >-
          status is "live" on every record seen, cancelled events included (the API also
          knows canceled, postponed and soldout). A cancellation shows in the title only:
          "CANCELED:...", "CANCELED | ...", "... - Event Cancelled".
        - >-
          localist_url is the detail page of the event and exists on every record; use it
          as the URL of the draft. url is whatever the organizer entered (missing on 47% of
          the records): a registration form, a ticket shop, the home page of a department,
          sometimes the event page of the department site.
        - >-
          There are no speaker names in a record (speaker_ids is a list of bare ids), so
          speakers have to be read from the title and the description. A title may contain
          HTML entities.
        - >-
          The subject filter (Science, Engineering/Technology, Medicine and 16 more) is too
          coarse for a field hint. Wellness fairs, nutrition classes and medical humanities
          are filed under Medicine, and 60 of the 71 records under Engineering/Technology
          come from departments outside the seven fields. Pass the names on as categories
          only.
        - >-
          An unknown id in type[] or exclude_type[] fails the whole request with HTTP 400
          (argument_error, "Unknown event filter"). If the calendar ever removes an event
          type, its id has to be removed here as well.
        - >-
          group_id (not used by this source) selects the events of one department or one
          group; ids come from /api/2/departments and /api/2/groups. group_id[] can be
          repeated and the ids are alternatives. It combines with type[] as AND. A list
          separated by commas is HTTP 400 and an unknown id is HTTP 404 for the whole
          request, also inside a list. The id of a school does not include the events of its
          departments. There is no separate department parameter: department_id is ignored.
        - >-
          The home page of the calendar also advertises an RSS feed (/xml/rss.xml and
          /calendar/1.xml) and an ICS feed (/calendar/1.ics), and its pages embed
          schema.org/Event JSON-LD. They were seen on the home page and not fetched; none
          is used, because only the API has event types, departments and instance ids.
        - >-
          Fixtures: the department and group lists were trimmed to id, name, urlname,
          filters and localist_url (the full items hold contact addresses and long
          descriptions). In the event pages, meeting passcodes (pwd values and written-out
          passcodes), the local parts of e-mail addresses and two telephone numbers were
          replaced by placeholders; everything else is as recorded. The fixture README.md
          lists every replacement.
