# Stanford Events (events.stanford.edu): the campus-wide calendar of Stanford University,
# served by the Localist API. Schema of one entry: seminars.models.SourceConfig; everything
# under "params" is read by the "localist" adapter only.
#
# The calendar lists events of every school and office, most of them outside the seven
# fields of this project (humanities, policy, arts, wellness). The source therefore has no
# default field: a draft gets its field hints from the department and group maps below, and
# an event that ends up without any field is dropped as out of scope.
#
# Requests of the adapter (verified against the live API on 2026-11-10 and 2026-11-11;
# fixtures in tests/fixtures/localist-stanford/, where README.md lists the recorded cases):
#
#   GET <url>?<parameters of one query>&start=<D1>&end=<D2>&pp=<per_page>&page=<n>
#
# * One series of requests per entry of params.queries. "type_ids" become repeated
#   "type[]" parameters and "exclude_type_ids" repeated "exclude_type[]" parameters.
# * D1 is the first local day of the time window and D2 the local day on which the window
#   ends (YYYY-MM-DD). "start" is inclusive and "end" is exclusive, like the window itself.
#   The parameter "days" was measured to be answered with HTTP 400 above 370 days; that the
#   same limit holds for a start/end range is an inference, not measured (the time window
#   of the settings spans 135 days). Without dates only the events of today come back.
# * "page" starts at 1 and is sent with every request. The answer carries
#   page: {current, size, total, total_items, next_page, previous_page}; the adapter follows
#   next_page until it is null. It never computes the number of pages from per_page: the
#   fixtures were recorded with pp=50 to keep the files small, and "pp" is ignored when a
#   recorded request is matched (like "start" and "end").
# * Never send "distinct" (it would collapse the instances of a recurring event) and never
#   send "match". By default several type[] values are alternatives (OR) and every other
#   criterion narrows the result (AND). match=any turns all criteria into alternatives,
#   match=all requires every type.
# * Every record is one event instance: events[].event.event_instances has exactly one
#   element. Its "id" is the native id of the draft. The queries do not overlap, but an
#   event moves from one to the other when its organizer adds an event type, so a record
#   whose instance id was already seen in the same run is dropped. Both queries belong to
#   one source for the same reason: the native id, and with it the uid, stays the same.

sources:
  - id: localist-stanford
    name: Stanford Events
    group: localist
    adapter: localist
    url: https://events.stanford.edu/api/2/events
    homepage: https://events.stanford.edu/
    institution: stanford
    host_org: Stanford University
    default_fields: []
    default_event_type: seminar
    aggregator: true
    params:
      # "pp". 100 is the maximum; a larger value is cut to 100 without an error.
      per_page: 100

      # Intended behaviour when a query fails (any HTTP error on any page, for example the
      # 400 that an unknown type id causes): the fetch of the whole source fails, and the
      # drafts of the other query are not used either, so health reports the source as
      # failed. A partial result would look like a healthy run, and the events of the
      # failed query would then count as gone from the source although they were never
      # asked for.
      queries:
        # Events that carry at least one of the five talk-like event types.
        - label: talk-types
          type_ids:
            - 37952570025304  # Class/Seminar
            - 37952570027353  # Conference/Symposium
            - 37952570034524  # Lecture/Presentation/Talk
            - 37952570047842  # Workshop
            - 40490468118962  # PhD Defense
        # Events on which the organizer set no event type at all: every known event type
        # is excluded. Seminar series of the neuroscience institute, grand rounds and
        # lectures of the Department of Surgery and several symposia are only found this
        # way. The list holds all 17 ids of event_types in /api/2/events/filters.
        - label: untyped
          exclude_type_ids:
            - 37952570025304  # Class/Seminar
            - 37952570027353  # Conference/Symposium
            - 37952570030426  # Exhibition
            - 37952570032475  # Film/Screening
            - 37952570034524  # Lecture/Presentation/Talk
            - 37952570036573  # Meeting
            - 37952570038622  # Fitness/Recreational Sport
            - 37952570040671  # Performance
            - 37952570042720  # Social Event/Reception
            - 37952570044769  # Tour
            - 37952570047842  # Workshop
            - 38406833071942  # Other
            - 39324630417361  # Academic Dates
            - 39324639694320  # Student Billing Dates
            - 40490468118962  # PhD Defense
            - 40864883971398  # Religious/Spiritual
            - 48623384665207  # Support Space

      # filters.event_types[].id of a record -> EventDraft.event_type_hint. An event can
      # carry several types; the first entry of this list that it carries decides. Events
      # without any of them get no hint (the source default applies).
      event_types:
        - {id: 40490468118962, name: PhD Defense, event_type: defense}
        - {id: 37952570027353, name: Conference/Symposium, event_type: conference}
        - {id: 37952570047842, name: Workshop, event_type: workshop}
        - {id: 37952570025304, name: Class/Seminar, event_type: seminar}
        - {id: 37952570034524, name: Lecture/Presentation/Talk, event_type: lecture}

      # departments[].name of a record -> EventDraft.field_hints (the union over all
      # departments of the event). Keys are the names exactly as the API returns them
      # (compare after stripping surrounding whitespace); every key exists in the recorded
      # list of all 736 departments (fixtures departments-page1..8.json). A department that
      # is not listed gives no hint. The key "departments" is missing in about 2% of the
      # records.
      #
      # Deliberately not listed: units outside the seven fields (earth sciences, energy,
      # civil, mechanical and aerospace engineering, management science), and units of the
      # School of Medicine whose events are not scientific talks: libraries and public
      # health education, wellness programs, medical humanities and ethics, patient
      # outreach, and the administrative, career and student offices.
      department_fields:
        # Mathematics and computational mathematics
        "Department of Mathematics": [math]
        "Mathematics Research Center": [math]
        "Institute for Computational and Mathematical Engineering (ICME)": [math]
        "Financial Math Program": [math]
        "Stanford Data Science": [math, ai-ml]
        # Computer science and electrical engineering
        "Computer Science Department": [cs]
        "Computer Science Department, Theory Group": [cs]
        "Stanford Computer Forum": [cs]
        "Electrical Engineering": [cs]
        "Information Systems Lab": [cs]
        "Center for Blockchain Research": [cs]
        "Stanford Center for Image Systems Engineering (SCIEN)": [cs]
        "Stanford High Performance Computing Center": [cs]
        "Stanford NetFPGA Project": [cs]
        "Stanford Robotics Center": [cs, ai-ml]
        # Artificial intelligence and machine learning
        "Stanford Artificial Intelligence Lab (SAIL)": [ai-ml, cs]
        "Stanford Institute for Human-Centered Artificial Intelligence (HAI)": [ai-ml]
        "Center for Artificial Intelligence in Medicine and Imaging (AIMI)": [ai-ml, med]
        # Chemistry, chemical engineering and materials
        "Chemistry Department": [chem]
        "Chemical Engineering": [chem]
        "Stanford ChEM-H": [chem, bio]
        "Materials Science and Engineering": [chem, physics]
        "Stanford University Mass Spectrometry": [chem]
        "Stanford Magnetic Resonance Laboratory": [chem, bio]
        # Biology and bioengineering
        "Department of Biology": [bio]
        "Bioengineering": [bio]
        "Bio-X Program": [bio]
        "Program in Human Biology": [bio]
        "Hopkins Marine Station": [bio]
        "Jasper Ridge Biological Preserve": [bio]
        "Center for Conservation Biology": [bio]  # two departments share this name
        "Carnegie Institution for Science - Department of Global Ecology": [bio]
        "Center for Computational, Evolutionary and Human Genomics (CEHG)": [bio]
        "Stanford Genome Technology Center": [bio]
        "Biomedical Computation at Stanford": [bio, cs]
        "Simbios": [bio]
        "National Center for Simulation in Rehabilitation Research (NCSRR)": [bio]
        "Mobilize Center within Bioengineering": [bio]
        "Wu Tsai Neurosciences Institute": [bio]
        "Wu Tsai Human Performance Alliance": [bio]
        "Center for Cognitive and Neurobiological Imaging": [bio]
        "Cognitive Neuroscience Interest Group": [bio]
        # Physics and applied physics
        "Department of Physics": [physics]
        "Department of Applied Physics": [physics]
        "Applied Physics/Physics Colloquium": [physics]
        "Stanford Institute for Theoretical Physics": [physics]
        "KIPAC": [physics]
        "PULSE": [physics]
        "HEPL Seminars": [physics]
        "SLAC National Accelerator Laboratory": [physics]
        "Ginzton Laboratory": [physics]
        "Q-FARM Initiative": [physics]
        "Stanford Photonics Research Center (SPRC)": [physics]
        "Solid State and Photonics Laboratory": [physics]
        "Center for Magnetic Nanotechnology": [physics]
        # School of Medicine: basic science departments, programs and institutes
        "Biochemistry": [bio, chem]
        "Chemical & Systems Biology": [bio, chem]
        "Molecular Pharmacology": [bio, chem]
        "Department of Structural Biology": [bio]
        "Department of Genetics": [bio]
        "Developmental Biology": [bio]
        "Molecular & Cellular Physiology": [bio]
        "Department of Neurobiology": [bio]
        "Cell Science Imaging Facility": [bio]
        "Department of Microbiology and Immunology": [bio, med]
        "Department of Biomedical Data Science": [bio, med]
        "Comparative Medicine": [bio, med]
        "Stanford Immunology Program": [bio, med]
        "Cancer Biology Program": [bio, med]
        "Institute for Immunity, Transplantation and Infection ITI": [bio, med]
        "Beckman Center for Molecular and Genetic Medicine": [bio, med]
        "Baxter Laboratory for Stem Cell Biology": [bio, med]
        "Stanford Center for Genomics and Personalized Medicine (SCGPM)": [bio, med]
        "Center for Molecular Neuroscience in Health and Disease": [bio, med]
        "Knight Initiative for Brain Resilience": [bio, med]
        "Stanford Cancer Institute": [bio, med]
        "Cardiovascular Institute": [bio, med]
        "Stanford Diabetes Research Center": [bio, med]
        "Canary Center": [bio, med]
        "Molecular Imaging Program at Stanford": [bio, med]
        "Center for Definitive and Curative Medicine": [bio, med]
        # School of Medicine: the school, clinical departments and divisions
        "School of Medicine": [med]
        "Stanford University School of Medicine": [med]
        "Department of Medicine": [med]
        "Department of Medicine, Division of Immunology/Rheumatology/CCIS": [med]
        "School of Medicine - Infectious Diseases & Geographic Medicine": [med]
        "School of Medicine Gastroenterology and Hepatology": [med]
        "School of Medicine - Emergency Medicine": [med]
        "Department of Anesthesiology": [med]
        "Department of Anesthesiology, Perioperative and Pain Medicine": [med]
