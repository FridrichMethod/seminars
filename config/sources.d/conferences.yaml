# The registry, kept by hand: Bay Area conferences and workshops that no enabled
# source delivers, and meetings elsewhere whose deadlines are kept (region world).
# Schema of the source entry: seminars.models.SourceConfig; every key of a meeting is
# described in the docstring of seminars.sources.custom.registry, and how to add or
# update one in docs/ADDING_A_SOURCE.md ("Conferences and workshops without a
# source").
#
# The adapter requests nothing. "url" is the page of this file on GitHub: the status
# page links it, so a reader sees where these meetings come from. It is a placeholder
# of the source contract (a source needs a url) and is never fetched.
#
# Rules for an entry:
# - Register a meeting only when no enabled source delivers it: search data/events.json
#   and the site for its title first. "url" is the organizer's page of the edition, or
#   the page of the series or program that announces it (say so in the notes). A
#   listing of the meeting by a source joins the entry only when it points at the same
#   page, starts on the first day, ends on the last and lasts at least 3 hours. A
#   calendar that links its own page of the event (Localist) never joins, nor does any
#   listing when "url" is the front page of a site: the meeting then shows twice.
# - Facts only, each from the organizer's page of the edition: title, dates, venue and
#   city, the dates of its deadlines. No description, no contact, no address of a
#   person, no date projected from an earlier edition. Labels of milestones are a few
#   words of our own. A milestone stated on another page than "verified" names that
#   page in its "url", which the feed of the deadlines links.
# - "verified" says when and on which page the facts were last checked. Check every
#   entry again at the start of each term, search data/events.json for it, and delete
#   it once a source lists the meeting. A test fails when an edition that starts within
#   120 days was checked more than 90 days before, or when no Bay Area edition is ahead
#   (tests/test_custom_registry.py).
# - Delete at most half of the listed editions, or fewer than five, in one change, and
#   let six runs pass before the next. A listing that shrinks more at once is taken as
#   incomplete for 28 runs: the deleted events stay, and a source-broken issue opens.
# - An id is "<series slug>-<year>" and is never renamed: it is the uid of the event.
# - Only "region: bay-area" entries become events. "world" entries carry milestones only.

sources:
  - id: conf-registry
    name: Conference registry (kept by hand)
    group: conferences
    adapter: registry
    url: https://github.com/FridrichMethod/seminars/blob/main/config/sources.d/conferences.yaml
    institution: other
    host_org: Conference registry
    default_event_type: conference
    meeting_horizon: true
    params:
      # Every meeting may be over between two curations: a run without a meeting
      # ahead is healthy, not a broken source.
      allow_empty: true
      meetings:
