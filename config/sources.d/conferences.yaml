# The registry: Bay Area conferences and workshops that no enabled source delivers,
# kept by hand. Schema of the source entry: seminars.models.SourceConfig; every key of
# a meeting is described in the docstring of seminars.sources.custom.registry, and
# how to add or update one in docs/ADDING_A_SOURCE.md ("Conferences and workshops
# without a source").
#
# The adapter requests nothing. "url" is the page of this file on GitHub: the status
# page links it, so a reader sees where these meetings come from. It is a placeholder
# of the source contract (a source needs a url) and is never fetched.
#
# Rules for an entry:
# - Register a meeting only when no enabled source delivers it: search data/events.json
#   and the site for its title first. A meeting that a source lists as well becomes one
#   event with that listing only when both point at the same page and start on the same
#   day, so "url" is the organizer's own page of the edition.
# - Facts only, each from the organizer's page of the edition: title, dates, venue and
#   city, the dates of its deadlines. No description, no contact, no address of a
#   person, no date projected from an earlier edition. Labels of milestones are a few
#   words of our own.
# - "verified" says when and on which page the facts were last checked. Check every
#   entry again at the start of each term; a test fails when an edition that starts
#   within 120 days was checked more than 90 days before, or when no Bay Area edition
#   is ahead (tests/test_custom_registry.py).
# - An id is "<series slug>-<year>" and is never renamed: it is the uid of the event.
# - Only "region: bay-area" entries become events. "world" entries carry milestones only.

sources:
