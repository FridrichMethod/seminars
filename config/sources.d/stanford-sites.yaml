        - 'Speaker only, no talk title, in the title ("MSE Colloquium: Robert Hovden"); before the speaker is known "MSE Colloquium: Speaker TBA". The page address changes when the speaker is announced and the old one redirects, but the guid stays, so the uid does too.'
