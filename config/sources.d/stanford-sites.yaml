  - <<: *site
    id: sites-systemx
    name: Stanford SystemX Alliance
    adapter: rss
    url: https://systemx.stanford.edu/events/all/rss
    urls:
      - https://systemx.stanford.edu/events
    homepage: https://systemx.stanford.edu/events
    host_org: Stanford SystemX Alliance
    default_fields: [cs]
    default_event_type: seminar
    params:
      <<: *su-event-params
      detail_page:
        # The shared detail_page, plus the speaker. A seminar names its speaker only in
        # the body, in the first sentence under the heading "Speaker Bio:" ("Dr. Ir.
        # Ingrid Verbauwhede is a Professor in the research group COSIC at KU Leuven.").
        # A bio that starts another way names nobody: a wrong speaker is worse than none.
        # The affiliation is what follows the first "at": capitalised words, with "of",
        # "for", "at", "the", "de" and the like between them, and a place after a comma
        # ("University of California, Berkeley"). It ends at a comma, a semicolon, a
        # parenthesis, the end of the sentence, or a lowercase clause ("and a member",
        # "in the Department"); without such an end ("Stanford University and Director
        # of ...") the speaker is kept and the affiliation left out, so that no part of
        # a longer name is taken for all of it. A period followed by a lowercase word
        # ("Univ. of Texas") ends nothing. A period followed by a capital ends an
        # abbreviation, not the sentence, after a single capital that follows a space or
        # a period and after the words "St", "Mt", "Ft", "Univ", "Inst", "Dept" and
        # "Natl", so an affiliation with one ("U.S. Naval Research Laboratory", "U.C.
        # Berkeley", "St. Jude Children's Research Hospital", "Univ. College London",
        # "Argonne Natl. Laboratory") is left out as well. After any other word the
        # period ends the sentence ("Texas A&M.", "MIT.", "Apple Inc.", "the Media
        # Lab.", and, a limit, "Mass." of "Mass. General Hospital"). The period of any
        # word ends the affiliation right before a comma, a semicolon or a parenthesis
        # and at the end of the line ("Stanford Univ., where", "Mount St.").
        # The pattern is verbose ((?x)): its spaces and line breaks are not part of it.
        <<: *su-detail-page
        speaker_label: '^Speaker Bio:?$'
        speaker_pattern: >-
          (?x)
          ^(?:(?:Dr|Prof|Professor|Ir)\.?\s+)*
          (?P<speaker>[A-Z][\w'-]+(?:\s+[A-Z][\w.'-]*){1,3}?)
          \s+is\s+(?:an?|the)\s+[^.]*?\bat\s+(?:the\s+)?
          (?:
          (?P<affiliation>[A-Z][\w&'-]*
          (?:\s+(?:(?:of|for|at|the|de|des|di|du|del|der|la|y|&)\s+)*[A-Z][\w&'-]*)*
          (?:,\s+(?!(?:Dr|Prof|Professor)\b)[A-Z][\w&'-]*(?:\s+[A-Z][\w&'-]*)*)?)
          (?=\.?\s*[,;(]|\.?\s*$
          |(?<![\s.][A-Z])(?<!\b(?:St|Mt|Ft))(?<!\b(?:Univ|Inst|Dept|Natl))\.(?!\s*[a-z])
          |\s+(?:and|as|in|since|where|who|with)\s+[a-z])
          )?
      event_type_names:
        Seminars: seminar
        Workshop: workshop
        Class/Seminar: seminar
        Lecture/Presentation/Talk: lecture
        Conference/Symposium: conference
        PhD Defense: defense
        Seminar: seminar
    research:
      verified: 2026-11-12
      sample_events: 2
      has_rss: true
      has_jsonld: false
      has_jsonapi: false
      extraction: feed
      crawl_delay: 30
      template: B
      requests_per_run: 4
      series_seen:
        - SystemX Seminar
      notes:
        - 'The SystemX Seminar of Electrical Engineering (Thursdays at 4:30 pm) and the events of the SystemX Alliance; 2 upcoming on 2026-11-12, the seminar of that day and a one-day summit on 2026-12-03 (type Workshop).'
        - 'The title of a seminar is the talk title. The speaker is only in the body of the detail page, under "Speaker Bio:"; the template has no speaker field, so detail_page.speaker_label and speaker_pattern read name and affiliation from the first sentence of the bio. The body becomes the abstract.'
        - 'The list page also has a "Past Events" block of 20 cards, which the item selector leaves out.'
        - 'Overlap: none. The Stanford Events calendar has no event of Electrical Engineering between 2026-10-28 and 2027-03-12 (see stanford-extra.yaml), and no other recording names these events.'
