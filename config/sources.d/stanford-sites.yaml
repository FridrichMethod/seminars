  - <<: *site
    id: sites-aimi
    name: Stanford AIMI
    adapter: rss
    url: https://aimi.stanford.edu/events/all/rss
    urls:
      - https://aimi.stanford.edu/events
    homepage: https://aimi.stanford.edu/events
    host_org: Stanford Center for Artificial Intelligence in Medicine and Imaging (AIMI)
    default_fields: [ai-ml, med]
    default_event_type: seminar
    params:
      <<: *su-event-params
      # Optional hints, match 5 of the 7 titles of the fixture (the other two, a course
      # and a symposium, have no series prefix). The series is the prefix up to the first
      # colon, and it ends in a word that names a series, so a talk title with a colon
      # is not read as one. A degree after the name ("Nigam Shah, MBBS, PhD") stays
      # outside the speaker group, and the first two patterns need at least one: every
      # recorded title that names a speaker has one, and without it the part after a
      # dash is as often the rest of the talk title ("Deep Learning for MRI - Part 2").
      # In the order of the patterns:
      #   "<series>: <talk title> - <speaker>, <degrees>"
      #   "<series>: <speaker>, <degrees>" (no talk title yet; the title stays as it is)
      #   "<series>: <talk title>" ("AIMI Grand Rounds: TBA")
      title_patterns:
        - '^(?P<series>[^:]*\b(?:Seminar|Colloquium|Rounds|Lecture|Series|Forum)s?):\s*(?P<title>.+)\s+-\s+(?P<speaker>[^,]+?)(?:\s*,\s*(?:MD|PhD|MBBS|MPH|MS|MSc|MA|MBA|JD|DrPH|ScD|DPhil|FACS|RN|PharmD|DO))+\s*$'
        - '^(?P<series>[^:]*\b(?:Seminar|Colloquium|Rounds|Lecture|Series|Forum)s?):\s*(?P<speaker>[A-Z][\w.''-]*(?:\s+[A-Z][\w.''-]*){1,3})(?:\s*,\s*(?:MD|PhD|MBBS|MPH|MS|MSc|MA|MBA|JD|DrPH|ScD|DPhil|FACS|RN|PharmD|DO))+\s*$'
        - '^(?P<series>[^:]*\b(?:Seminar|Colloquium|Rounds|Lecture|Series|Forum)s?):\s*(?P<title>.+?)\s*$'
    research:
      verified: 2026-11-12
      sample_events: 7
      has_rss: true
      has_jsonld: false
      has_jsonapi: false
      extraction: feed
      crawl_delay: 30
      template: B
      requests_per_run: 5
      series_seen:
        - Computational Medicine Research Colloquium
        - AI4MH Seminar
        - IBIIS-AIMI Seminar
        - AIMI Grand Rounds
      notes:
        - '7 upcoming events on 2026-11-12, 5 in the run window. The weekly Computational Medicine Research Colloquium (Thursdays at noon) is listed one talk at a time; its card links to the series page on computationalmedicine.stanford.edu, which lists past talks and the current one, nothing later.'
        - 'Two cards (the colloquium and the AI4MH Seminar) link to other hosts; the link is the url of the event and is not fetched. The detail pages of the native cards in the window are fetched (3 on 2026-11-12); they add the abstract or a description of the series.'
        - 'The title holds series, talk title and speaker ("<series>: <talk title> - <speaker>, <degrees>"); see title_patterns.'
        - 'The HAILS leadership course (2027-05-14) and the AIMI Symposium (2027-05-17) are outside the window; the course is a paid executive program, not a talk, and the taxonomy excludes it as a course ("leadership strategy course").'
        - 'Overlap: none. localist.yaml maps the departments "Center for Artificial Intelligence in Medicine and Imaging (AIMI)" and IBIIS, but no record of the Stanford Events calendar carried either in the window of 2026-11-12, and no other recording names one of these talks or speakers.'

