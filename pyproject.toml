[project]
name = "seminars"
version = "0.1.0.dev0"
description = "Daily scraper of Stanford-area academic seminars: ICS feeds, a static site and a weekly digest"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "FridrichMethod" }]
dependencies = [
    "anthropic>=2.8",
    "feedparser>=6.0",
    "httpx>=0.28",
    "icalendar>=7.3",
    "openai>=3.49",
    "pydantic>=2.14,<3",
    "python-dateutil>=4.0",
    "python-dotenv>=1.2",
    "pyyaml>=6.0",
    "rapidfuzz>=3.14",
    "selectolax>=1.0",
    "typer>=0.29",
    "tzdata>=2026.1",
]

[project.optional-dependencies]
browser = ["playwright>=1.65"]

[project.scripts]
seminars = "seminars.cli:app"

[dependency-groups]
dev = [
    "hypothesis>=6.170",
    "pyright>=1.1.414",
    "pytest>=9.2",
    "pytest-cov>=7.1",
    "respx>=0.23",
    "ruff>=0.17.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/seminars"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]
extend-exclude = [".worktrees"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "C4", "PT"]

[tool.ruff.lint.isort]
known-first-party = ["seminars"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.pyright]
include = ["src", "tests", "scripts"]
exclude = ["**/__pycache__", ".venv", ".worktrees", "tests/fixtures"]
extraPaths = ["tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
reportUnnecessaryTypeIgnoreComment = "error"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "-m", "not live and not browser"]
markers = [
    "live: talks to the real network (deselected by default; run with -m live)",
    "browser: needs Playwright and a browser (deselected by default; run with -m browser)",
]

[tool.coverage.run]
source_pkgs = ["seminars"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "\\.\\.\\.",
]
