[project]
name = "seminars"
version = "0.1.0.dev0"
description = "Daily scraper of Stanford-area academic seminars: ICS feeds, a static site and a weekly digest"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "FridrichMethod" }]
dependencies = [
    "anthropic>=2.8",
    "feedparser>=6.0",
    "httpcore>=1.0",
    "httpx>=0.28",
    "icalendar>=7.3",
    "openai>=3.49",
    "pydantic>=2.14,<3",
    "python-dateutil>=4.0",
    "python-dotenv>=1.2",
    "pyyaml>=6.0",
    "rapidfuzz>=3.14",
    "selectolax>=1.0",
    "typer>=0.29",
    "tzdata>=2026.1",
]

[project.optional-dependencies]
browser = ["playwright>=1.65"]

[project.scripts]
seminars = "seminars.cli:app"

[dependency-groups]
dev = [
    "hypothesis>=6.170",
    "pyright>=1.1.414",
    "pytest>=9.2",
    "pytest-cov>=7.1",
    "respx>=0.23",
    "ruff>=0.17.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/seminars"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]
extend-exclude = [".worktrees"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "C4", "PT"]
# RUF012: the models derive from seminars.models.Model (a pydantic BaseModel), which copies
# mutable defaults per instance; ruff cannot see that through the cross-module base class.
ignore = ["RUF012"]

[tool.ruff.lint.isort]
known-first-party = ["seminars"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.pyright]
include = ["src", "tests", "scripts"]
exclude = ["**/__pycache__", ".venv", ".worktrees", "tests/fixtures"]
extraPaths = ["tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
# Consequence for optional dependencies (playwright in the "browser" extra): never import
# them statically. Without the extra the import does not resolve, and an ignore comment on it
# is an error once the extra is installed. Tests use the playwright_sync_api fixture
# (tests/conftest.py); package code uses importlib.import_module.
reportUnnecessaryTypeIgnoreComment = "error"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["tests"]
# Recorded fixtures are whatever a site sent; pytest must never import a file from there.
# The first nine patterns are the defaults of pytest, which this option replaces.
norecursedirs = [
    "*.egg",
    ".*",
    "_darcs",
    "build",
    "CVS",
    "dist",
    "node_modules",
    "venv",
    "{arch}",
    "tests/fixtures",
    "tests/fixtures/*",
]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "-p",
    "no:doctest",
    "-m",
    "not live and not browser",
]
markers = [
    "live: talks to the real network (deselected by default; run with -m live)",
    "browser: needs Playwright and a browser (deselected by default; run with -m browser)",
]

[tool.coverage.run]
source_pkgs = ["seminars"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
# The last pattern drops protocol method bodies. It must match a line that is nothing but
# "...": an unanchored pattern also hits signatures such as "-> tuple[X, ...]:", and a
# matching "def" line makes coverage exclude the whole function.
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "^[ \\t]*\\.\\.\\.[ \\t]*$",
]
